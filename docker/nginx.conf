server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Internal NAV history archive — not a dated snapshot, not for public consumption
    location = /snapshots/nav-series.json {
        return 404;
    }

    # Serve snapshot JSON files
    location /snapshots/ {
        alias /data/snapshots/;
        add_header Cache-Control "no-cache";
        types {
            application/json json;
        }
    }
}
