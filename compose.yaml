services:
  fund-analysis:
    image: ghcr.io/the3dsandwich/fund-analysis:latest
    ports:
      - "${PORT:-3000}:80"
    environment:
      - REFRESH_HOUR=${REFRESH_HOUR:-2}
      - REFRESH_MINUTE=${REFRESH_MINUTE:-0}
      - TZ=${TZ:-Asia/Taipei}
    volumes:
      - snapshots:/data/snapshots
    labels:
      - com.centurylinklabs.watchtower.scope=fund-analysis
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_SCOPE=fund-analysis
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_POLL_INTERVAL:-3600}
      - WATCHTOWER_CLEANUP=true
    labels:
      - com.centurylinklabs.watchtower.scope=fund-analysis
    restart: unless-stopped

volumes:
  snapshots:
